name: Domain isolation contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:domain-isolation
      - run: pnpm --dir apps/mobile exec tsc --noEmit
      - name: Install pinned isolated PostgreSQL engine
        run: npm install --prefix "$RUNNER_TEMP/burrow-test-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.10
      - name: Verify owner-only room transactions without production access
        run: BURROW_PGLITE_PATH="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite/dist/index.js" pnpm test:personal-rooms:db
      - name: Verify payments, economic isolation and deletion without production access
        run: BURROW_PGLITE_PATH="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite/dist/index.js" pnpm test:security:db
      - name: Verify every current Shop capability and checkout without production access
        run: BURROW_PGLITE_PATH="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite/dist/index.js" node tools/test-shop-support279-database.mjs
      - name: Verify approved pricing, Plus and existing ownership without production access
        run: BURROW_PGLITE_PATH="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite/dist/index.js" node tools/test-shop-pricing283-database.mjs
      - name: Verify four independent garden actions, rewards and owner-only quests without production access
        run: PGLITE_MODULE="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite" node --test tools/test-garden-care284-database.cjs
      - name: Verify narrowly scoped Touch Note test exception without production access
        run: BURROW_PGLITE_PATH="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tools/test-plushie-touch-test-pair-database.mjs
      - name: Verify expiring current-pair test permission and committed transaction recovery without production access
        run: BURROW_PGLITE_PATH="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tools/test-temporary-pair285-database.mjs
      - name: Verify owner-scoped Plushie photos and unpaired visibility without production access
        run: BURROW_PGLITE_PATH="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tools/test-personal-plushie-photos281-database.mjs tools/test-burrow-unpaired-bootstrap.mjs
      - name: Verify unlimited Plushie replacement and current-frame retention without production access
        run: BURROW_PGLITE_PATH="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tools/test-photo-retention286-database.mjs
      - name: Rehearse protected photo retention and placeholder-copy release transactions without production access
        run: BURROW_PGLITE_PATH="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite/dist/index.js" node tools/test-photo286-copy287-release.mjs
      - name: Verify recipient-only Touch Note history and personal-photo Moments without production access
        run: |
          BURROW_PGLITE_PATH="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tools/test-plushie-touch-v2-database.mjs
          PGLITE_MODULE="$RUNNER_TEMP/burrow-test-db/node_modules/@electric-sql/pglite" node --test tools/test-toy-moment-windows-database.cjs
